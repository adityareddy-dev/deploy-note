modules:
  jira:issuePanel:
    - key: deploy-note-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Deploy Note
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/528aa571-9664-4bd8-b90b-f024bd2c9593
